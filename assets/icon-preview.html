<!DOCTYPE html>
<html>
<head>
<title>Brain Bee Prep - App Icon Preview</title>
<style>
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, sans-serif; color: white; }
  h2 { margin-bottom: 20px; font-weight: 300; opacity: 0.7; }
  .icons { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .icon-wrap { text-align: center; }
  .icon-wrap p { margin-top: 12px; opacity: 0.5; font-size: 14px; }
  img, object { border-radius: 22%; }
  .s1024 { width: 256px; height: 256px; }
  .s512 { width: 128px; height: 128px; }
  .s180 { width: 60px; height: 60px; }
</style>
</head>
<body>
  <h2>App Icon Preview</h2>
  <div class="icons">
    <div class="icon-wrap">
      <object data="icon.svg" type="image/svg+xml" class="s1024"></object>
      <p>App Store (1024px)</p>
    </div>
    <div class="icon-wrap">
      <object data="icon.svg" type="image/svg+xml" class="s512"></object>
      <p>Home Screen (512px)</p>
    </div>
    <div class="icon-wrap">
      <object data="icon.svg" type="image/svg+xml" class="s180"></object>
      <p>Small (180px)</p>
    </div>
  </div>
</body>
</html>
